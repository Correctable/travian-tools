<body>

<script>
const canvas=document.getElementById('map'),ctx=canvas.getContext('2d');
let viewX=0,viewY=0,tileSize=16;
const MIN_T=3,MAX_T=34;
let isDrag=false,dragMoved=false,lastX=0,lastY=0,hover=null,selected={x:0,y:0};
let liveMode=true;

function numberValue(row,...names){
  const value=names.map(name=>row[name]).find(value=>value!==undefined&&value!==null&&value!=='');
  return Number(value);
}

function payloadRows(payload,...names){
  for(const name of names){
    if(Array.isArray(payload[name])) return payload[name];
  }
  return [];
}

function normalizeOtherTile(row){
  const raw=String(row.type||row.terrain||row.tile_type||row.type_name||row.name||row.kind||'').toLowerCase();
  const type=raw.includes('mount')||raw.includes('gunung')?'Gunung'
    :raw.includes('lake')||raw.includes('danau')?'Danau'
    :raw.includes('forest')||raw.includes('hutan')?'Hutan':'TanahLiat';
  return {kind:'other',data:{type}};
}

function normalizeOasis(row){
  const name=String(row.type_name||'').toLowerCase(), res=String(row.resources||'').toLowerCase();
  const pick=t=>/crop|gandum|wheat|grain/.test(t)?'crop':/iron|besi/.test(t)?'iron':/clay|liat/.test(t)?'clay':/wood|lumber|kayu/.test(t)?'wood':null;
  const resource=pick(name)||pick(res)||'wood';
  const bonus=String(row.bonus_str||'');
  const isDouble=(bonus.match(/%/g)||[]).length>=2||Number(row.max_bonus)>=50;
  return {kind:'oasis',data:{resource,type_name:row.type_name||'',bonus_str:bonus,is_double:isDouble?1:0}};
}

function normalizeVillageTile(row){
  const label=row.field_label||[row.wood,row.clay,row.iron,row.crop].join('-');
  return {kind:'empty',data:{field_label:label,crop:Number(row.crop)||0}};
}

// ---- chunked terrain loading (oases + village_tiles + other_tiles) ----
const CHUNK=50, MAX_CONCURRENT=4, WORLD=200;
const chunkState=new Map();   // "cx,cy" -> 'loading' | 'done'
let activeLoads=0, chunkErrors=0;

function updateStatus(){
  document.getElementById('status').textContent=
    `Live · ${liveVillages.size.toLocaleString()} villages · ${liveOases} oases · ${liveTiles.size-liveOases} terrain · ${liveEmpty.size.toLocaleString()} slots`+
    (chunkErrors?` · ${chunkErrors} chunk gagal`:'');
}

async function loadChunk(cxk,cyk){
  const config=window.SERVER_CONFIG, key=`${cxk},${cyk}`;
  chunkState.set(key,'loading'); activeLoads++;
  try{
    const u=new URL(`${config.apiBase}/api/map-tiles`);
    u.searchParams.set('server',config.apiKey);
    u.searchParams.set('x1',Math.max(-WORLD,cxk*CHUNK));
    u.searchParams.set('x2',Math.min(WORLD,cxk*CHUNK+CHUNK-1));
    u.searchParams.set('y1',Math.max(-WORLD,cyk*CHUNK));
    u.searchParams.set('y2',Math.min(WORLD,cyk*CHUNK+CHUNK-1));
    const r=await fetch(u);
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const d=await r.json();
    if(!d.ok) throw new Error(d.error||'map-tiles failed');
    payloadRows(d,'other_tiles','other','others').forEach(row=>{
      const x=numberValue(row,'x','coord_x','tile_x'),y=numberValue(row,'y','coord_y','tile_y');
      if(Number.isFinite(x)&&Number.isFinite(y)) liveTiles.set(`${x},${y}`,normalizeOtherTile(row));
    });
    payloadRows(d,'oases','oasis').forEach(row=>{
      const x=numberValue(row,'x','coord_x','tile_x'),y=numberValue(row,'y','coord_y','tile_y');
      const k=`${x},${y}`;
      if(!Number.isFinite(x)||!Number.isFinite(y)) return;
      if(!liveTiles.has(k)) liveOases++;
      liveTiles.set(k,normalizeOasis(row));
    });
    payloadRows(d,'village_tiles','tiles','villages').forEach(row=>{
      const x=numberValue(row,'x','coord_x','tile_x'),y=numberValue(row,'y','coord_y','tile_y');
      if(Number.isFinite(x)&&Number.isFinite(y)) liveEmpty.set(`${x},${y}`,normalizeVillageTile(row));
    });
    chunkState.set(key,'done');
  }catch(err){
    chunkState.set(key,'failed'); chunkErrors++;   // tidak di-retry otomatis, mencegah loop
    console.warn('[mapv2] chunk',key,err);
  }finally{
    activeLoads--; updateStatus(); render(); pumpChunks();
  }
}

let wantedChunks=[];
function ensureChunks(b){
  if(!window.SERVER_CONFIG) return;
  const c1=Math.floor(Math.max(b.x1,-WORLD)/CHUNK), c2=Math.floor(Math.min(b.x2,WORLD)/CHUNK);
  const r1=Math.floor(Math.max(b.y1,-WORLD)/CHUNK), r2=Math.floor(Math.min(b.y2,WORLD)/CHUNK);
  const mx=(viewX/CHUNK)-0.5, my=(viewY/CHUNK)-0.5, list=[];
  for(let cx=c1;cx<=c2;cx++) for(let cy=r1;cy<=r2;cy++){
    if(!chunkState.has(`${cx},${cy}`)) list.push([cx,cy,(cx-mx)**2+(cy-my)**2]);
  }
  list.sort((a,b)=>a[2]-b[2]);       // chunk terdekat dengan tengah layar dulu
  wantedChunks=list; pumpChunks();
}
function pumpChunks(){
  while(activeLoads<MAX_CONCURRENT&&wantedChunks.length){
    const [cx,cy]=wantedChunks.shift();
    if(!chunkState.has(`${cx},${cy}`)) loadChunk(cx,cy);
  }
}

async function loadLiveData(){
  const config=window.SERVER_CONFIG;
  if(!config) throw new Error('Server configuration unavailable');
  const mapUrl=new URL(`${config.apiBase}/api/map`);
  mapUrl.searchParams.set('server',config.apiKey);
  mapUrl.searchParams.set('range','200');
  const mapResponse=await fetch(mapUrl);
  if(!mapResponse.ok) throw new Error(`Map API HTTP ${mapResponse.status}`);
  const mapPayload=await mapResponse.json();
  if(!mapPayload.ok) throw new Error(mapPayload.error||'Map API failed');
  (mapPayload.rows||[]).forEach(row=>{
    const x=Number(row.x),y=Number(row.y);
    if(Number.isFinite(x)&&Number.isFinite(y)) liveVillages.set(`${x},${y}`,{
      village_name:row.village_name||'',player_name:row.player_name||'',alliance_tag:row.alliance_tag||'',
      population:Number(row.population)||0,is_capital:Number(row.is_capital)===1,tribe:Number(row.tribe)||0
    });
  });
  updateStatus();
  ensureChunks(bounds(0.05));   // terrain dimuat per chunk sesuai area yang terlihat
}

async function bootLiveData(){
  try{ await loadLiveData(); }
  catch(error){
    dataStatus=`Data unavailable · ${error.message}`;
    document.getElementById('status').textContent=dataStatus;
    console.error('[mapv2]',error);
  }
  render();
}

function resize(){
  const rect=canvas.parentElement.getBoundingClientRect();
  canvas.width=Math.max(1,Math.floor(rect.width));
  canvas.height=Math.max(1,Math.floor(rect.height));
  render();
}
addEventListener('resize',resize);
addEventListener('load',resize);
new ResizeObserver(resize).observe(document.getElementById('map-shell'));

// ---- deterministic fallback for tiles that have no live terrain row ----
function h32(x,y){let n=x*374761393+y*668265263;n=(n^(n>>>13))*1274126177;n=n^(n>>>16);return n>>>0;}
function rnd(x,y,salt){return (h32(x+salt*1000003,y-salt*7919)%100000)/100000;}
const ALLIANCES=["WAR","WOLF","WTF","XXL","ZZZ","GOD","RIP","FURY","NOVA","IRON"];
const TRIBE_C={1:'#5f7fae',2:'#a2564f',3:'#5c9463',4:'#b39a4a',5:'#8a6ea8',6:'#5f9aa8'};
const OASIS_ICON={wood:'🌲',clay:'🧱',iron:'⛏️',crop:'🌾'};
const RESOURCE_TERRAIN={wood:'Hutan',clay:'TanahLiat',iron:'Gunung',crop:'Danau'};
const OTHER_TYPES=["Hutan","Gunung","Danau","TanahLiat"];
function hashColor(str,s=55,l=45){let h=0;for(let i=0;i<str.length;i++)h=str.charCodeAt(i)+((h<<5)-h);return `hsl(${Math.abs(h)%360},${s}%,${l}%)`;}

function regionInfo(x,y){
  const rs=7,rx=Math.floor(x/rs),ry=Math.floor(y/rs);
  const seed=rnd(rx*31337,ry*92821,9);
  return {hasAlliance:seed<0.35, tag:ALLIANCES[Math.floor(seed*97)%ALLIANCES.length]};
}

const GREYZONE_RADIUS=22;
function isGreyZone(x,y){
  if(x===0&&y===0) return false; // ibu kota selalu di luar greyzone
  const d=Math.sqrt(x*x+y*y);
  return d < GREYZONE_RADIUS;
}

const liveTiles = new Map();
const liveVillages = new Map();
const liveEmpty = new Map();   // village_tiles (slot kosong + tipe field)
let liveOases = 0;
let dataStatus = 'Connecting…';

function liveTileAt(x,y){
  return liveTiles.get(`${x},${y}`) || null;
}

function tileAt(x,y){
  const live = liveTileAt(x,y);
  if(live) return live;
  if(!liveMode&&x===0&&y===0){
    return {kind:'village',data:{village_name:'Ibu Kota',player_name:'Kamu',alliance_tag:'YOU',population:320,is_capital:1,tribe:1}};
  }
  const village = liveVillages.get(`${x},${y}`);
  if(village) return {kind:'village',data:village};
  if(liveMode) return liveEmpty.get(`${x},${y}`)||{kind:'empty',data:{field_label:'-'}};
  const rOther=rnd(x,y,1);
  if(rOther<0.045) return {kind:'other',data:{type:OTHER_TYPES[Math.floor(rnd(x,y,5)*4)]}};
  const rOasis=rnd(x,y,2);
  if(rOasis<0.045){
    const isDouble=rnd(x,y,6)<0.12;
    const resources=['wood','clay','iron','crop'];
    const resource=resources[Math.floor(rnd(x,y,7)*4)];
    return {kind:'oasis',data:{resource,type_name:RESOURCE_TERRAIN[resource],is_double:isDouble?1:0,bonus_str:isDouble?'50%':'25%'}};
  }
  const region=regionInfo(x,y);
  const grey=isGreyZone(x,y);
  if(grey){
    const rNatar=rnd(x,y,50);
    if(rNatar<0.02) return {kind:'natar',data:{camp_name:'Kamp Natar '+(1+Math.floor(rnd(x,y,51)*40))}};
    const labels=["4-4-4-6","3-4-5-6","4-3-4-6","3-3-6-6"];
    return {kind:'empty',data:{field_label:labels[Math.floor(rnd(x,y,15)*labels.length)],grey:true}};
  }
  const base=region.hasAlliance?0.32:0.07;
  const rVillage=rnd(x,y,3);
  if(rVillage<base){
    const hasAlly=region.hasAlliance || rnd(x,y,8)<0.15;
    const tribe=1+Math.floor(rnd(x,y,10)*6);
    return {kind:'village',data:{
      village_name:'Desa '+(1000+Math.floor(rnd(x,y,11)*8999)),
      player_name:'Player'+Math.floor(rnd(x,y,12)*999),
      alliance_tag:hasAlly?region.tag:'',
      population:40+Math.floor(rnd(x,y,13)*900),
      is_capital:rnd(x,y,14)<0.05?1:0,
      tribe
    }};
  }
  const labels=["4-4-4-6","3-4-5-6","4-3-4-6","3-3-6-6"];
  return {kind:'empty',data:{field_label:labels[Math.floor(rnd(x,y,15)*labels.length)]}};
}
function villageColor(v){ if(v.alliance_tag==='YOU') return '#c9a24b'; if(v.alliance_tag) return hashColor(v.alliance_tag); return TRIBE_C[v.tribe]||'#6b6b6b'; }

// ---- transforms ----
function s2w(sx,sy){return {x:Math.round(viewX+(sx-canvas.width/2)/tileSize), y:Math.round(viewY-(sy-canvas.height/2)/tileSize)};}
function s2wf(sx,sy){return {x:viewX+(sx-canvas.width/2)/tileSize, y:viewY-(sy-canvas.height/2)/tileSize};}
function bounds(margin){const hw=canvas.width/2/tileSize,hh=canvas.height/2/tileSize,mx=hw*margin,my=hh*margin;
  return {x1:Math.floor(viewX-hw-mx),x2:Math.ceil(viewX+hw+mx),y1:Math.floor(viewY-hh-my),y2:Math.ceil(viewY+hh+my)};}

// ---- terrain vector drawing ----
function drawGrass(sx,sy,cell,x,y,grey){
  const dark=(x+y)%2===0;
  if(grey) ctx.fillStyle=dark?'#7d8083':'#868a8d';
  else ctx.fillStyle=dark?'#7fa652':'#87ac58';
  ctx.fillRect(sx,sy,cell,cell);
}
function drawMountain(sx,sy,cell){
  ctx.fillStyle='#9c9384'; ctx.fillRect(sx,sy,cell,cell);
  ctx.fillStyle='#c9c3b6';
  ctx.beginPath();ctx.moveTo(sx+cell*0.1,sy+cell*0.85);ctx.lineTo(sx+cell*0.4,sy+cell*0.3);ctx.lineTo(sx+cell*0.65,sy+cell*0.85);ctx.closePath();ctx.fill();
  ctx.fillStyle='#e8e4da';
  ctx.beginPath();ctx.moveTo(sx+cell*0.45,sy+cell*0.85);ctx.lineTo(sx+cell*0.72,sy+cell*0.18);ctx.lineTo(sx+cell*0.95,sy+cell*0.85);ctx.closePath();ctx.fill();
}
function drawLake(sx,sy,cell){
  ctx.fillStyle='#5f93b8'; ctx.fillRect(sx,sy,cell,cell);
  ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=Math.max(1,cell*0.04);
  ctx.beginPath(); ctx.arc(sx+cell*0.5,sy+cell*0.55,cell*0.28,Math.PI*0.15,Math.PI*0.75); ctx.stroke();
}
function drawSwamp(sx,sy,cell){
  ctx.fillStyle='#5c6b48'; ctx.fillRect(sx,sy,cell,cell);
  ctx.strokeStyle='#3f4a30'; ctx.lineWidth=Math.max(1,cell*0.06);
  for(let i=0;i<3;i++){
    const rx=sx+cell*(0.25+i*0.25), ry=sy+cell*0.8;
    ctx.beginPath(); ctx.moveTo(rx,ry); ctx.lineTo(rx-cell*0.05,ry-cell*0.5); ctx.stroke();
  }
}
function drawForest(sx,sy,cell,x,y){
  ctx.fillStyle='#4f7a3f'; ctx.fillRect(sx,sy,cell,cell);
  const spots=[[0.28,0.3],[0.62,0.22],[0.78,0.55],[0.4,0.62],[0.18,0.72],[0.6,0.8]];
  spots.forEach((p,i)=>{
    const seed=rnd(x,y,30+i);
    drawTree(sx+cell*p[0], sy+cell*p[1], cell*0.19, seed);
  });
}
function drawCanyon(sx,sy,cell,x,y){
  ctx.fillStyle='#b08a5e'; ctx.fillRect(sx,sy,cell,cell);
  ctx.fillStyle='#8f6c43';
  ctx.beginPath();
  ctx.moveTo(sx,sy+cell*0.3); ctx.lineTo(sx+cell*0.45,sy+cell*0.1); ctx.lineTo(sx+cell*0.8,sy+cell*0.4);
  ctx.lineTo(sx+cell,sy+cell*0.25); ctx.lineTo(sx+cell,sy+cell); ctx.lineTo(sx,sy+cell); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#6e5433'; ctx.lineWidth=Math.max(1,cell*0.04);
  ctx.beginPath(); ctx.moveTo(sx+cell*0.1,sy+cell*0.55); ctx.lineTo(sx+cell*0.5,sy+cell*0.45); ctx.lineTo(sx+cell*0.9,sy+cell*0.7); ctx.stroke();
}
function drawTree(cx,cy,r,seed){
  ctx.fillStyle=seed<0.5?'#3f7a3a':'#4a8a44';
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#356b32';
  ctx.beginPath(); ctx.arc(cx-r*0.35,cy+r*0.25,r*0.65,0,Math.PI*2); ctx.fill();
}
function drawBadge(cx,cy,r,ringColor,icon,iconSize){
  ctx.fillStyle='#f5f0e0';
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=ringColor; ctx.lineWidth=Math.max(1.5,r*0.28);
  ctx.beginPath(); ctx.arc(cx,cy,r-ctx.lineWidth/2,0,Math.PI*2); ctx.stroke();
  if(icon){
    ctx.font=`${iconSize}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(icon,cx,cy+1);
  }
}

function render(){
  ctx.fillStyle='#588142';ctx.fillRect(0,0,canvas.width,canvas.height);
  const b=bounds(0.05),cell=Math.max(tileSize,1);
  ensureChunks(b);
  const detailed=tileSize>=6, withIcon=tileSize>=14;

  for(let x=b.x1;x<=b.x2;x++){
    for(let y=b.y1;y<=b.y2;y++){
      const t=tileAt(x,y);
      const sx=Math.round((x-viewX)*tileSize+canvas.width/2-tileSize/2);
      const sy=Math.round(-(y-viewY)*tileSize+canvas.height/2-tileSize/2);
      const cx=sx+cell/2, cy=sy+cell/2;

      if(t.kind==='other'){
        if(!detailed){ ctx.fillStyle='#8b8578'; ctx.fillRect(sx,sy,cell,cell); }
        else if(t.data.type==='Gunung') drawMountain(sx,sy,cell);
        else if(t.data.type==='Danau') drawLake(sx,sy,cell);
        else if(t.data.type==='Hutan') drawForest(sx,sy,cell,x,y);
        else drawCanyon(sx,sy,cell,x,y);
        continue;
      }

      if(t.kind==='oasis'){
        if(!detailed){ ctx.fillStyle='#4a7a4a'; ctx.fillRect(sx,sy,cell,cell); }
        else if(t.data.resource==='iron') drawMountain(sx,sy,cell);
        else if(t.data.resource==='crop') drawLake(sx,sy,cell);
        else if(t.data.resource==='wood') drawForest(sx,sy,cell,x,y);
        else drawCanyon(sx,sy,cell,x,y);
        if(detailed) drawBadge(cx,cy,cell*0.3, t.data.is_double?'#c9a24b':'#4a7a4a', withIcon?OASIS_ICON[t.data.resource]:null, cell*0.32);
        else { ctx.fillStyle=t.data.is_double?'#c9a24b':'#e8e3d8'; ctx.beginPath();ctx.arc(cx,cy,cell*0.22,0,Math.PI*2);ctx.fill(); }
        continue;
      }

      drawGrass(sx,sy,cell,x,y, t.data.grey || false);

      if(t.kind==='village'){
        if(!detailed){ ctx.fillStyle=villageColor(t.data); ctx.beginPath();ctx.arc(cx,cy,cell*0.35,0,Math.PI*2);ctx.fill(); }
        else drawBadge(cx,cy,cell*0.36, t.data.is_capital?'#c9a24b':villageColor(t.data),
                       withIcon?(t.data.is_capital?'🏰':'🏠'):null, cell*0.42);
      } else if(t.kind==='natar'){
        if(!detailed){ ctx.fillStyle='#7a3b3b'; ctx.beginPath();ctx.arc(cx,cy,cell*0.3,0,Math.PI*2);ctx.fill(); }
        else drawBadge(cx,cy,cell*0.3, '#7a3b3b', withIcon?'🐾':null, cell*0.32);
      }
    }
  }

  for(const p of [hover,selected]){
    if(!p) continue;
    const sx=Math.round((p.x-viewX)*tileSize+canvas.width/2-tileSize/2);
    const sy=Math.round(-(p.y-viewY)*tileSize+canvas.height/2-tileSize/2);
    ctx.strokeStyle=p===selected?'#1c1f24':'#ffffff'; ctx.lineWidth=2;
    ctx.strokeRect(sx-1,sy-1,cell+2,cell+2);
  }
  drawRulers(b);
  document.getElementById('coord').textContent=`${Math.round(viewX)} | ${Math.round(viewY)}  ·  ${tileSize.toFixed(0)}px/tile`;
}

function niceStep(pxTarget){
  const raw=pxTarget/tileSize;
  const pow=Math.pow(10,Math.floor(Math.log10(raw||1)));
  const n=raw/pow;
  const mult=n<1.5?1:n<3.5?2:n<7.5?5:10;
  return Math.max(1,Math.round(mult*pow));
}
function drawRulers(b){
  const RULER_H=22, RULER_W=34, step=niceStep(70);
  ctx.font='11px -apple-system,Segoe UI,Roboto,sans-serif';
  ctx.fillStyle='rgba(20,22,26,0.88)';
  ctx.fillRect(0,canvas.height-RULER_H,canvas.width,RULER_H);
  ctx.fillRect(0,0,RULER_W,canvas.height-RULER_H);
  ctx.strokeStyle='#2c3038'; ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,canvas.height-RULER_H+0.5);ctx.lineTo(canvas.width,canvas.height-RULER_H+0.5);ctx.stroke();
  ctx.beginPath();ctx.moveTo(RULER_W+0.5,0);ctx.lineTo(RULER_W+0.5,canvas.height);ctx.stroke();
  ctx.fillStyle='#9a978c'; ctx.textBaseline='middle';
  const xStart=Math.floor(b.x1/step)*step;
  for(let x=xStart;x<=b.x2;x+=step){
    const sx=(x-viewX)*tileSize+canvas.width/2;
    if(sx<RULER_W||sx>canvas.width) continue;
    ctx.strokeStyle='#3a3d43';
    ctx.beginPath();ctx.moveTo(sx+0.5,canvas.height-RULER_H);ctx.lineTo(sx+0.5,canvas.height-RULER_H+6);ctx.stroke();
    ctx.textAlign='center'; ctx.fillText(String(x), sx, canvas.height-RULER_H/2+1);
  }
  const yStart=Math.floor(b.y1/step)*step;
  for(let y=yStart;y<=b.y2;y+=step){
    const sy=-(y-viewY)*tileSize+canvas.height/2;
    if(sy<0||sy>canvas.height-RULER_H) continue;
    ctx.strokeStyle='#3a3d43';
    ctx.beginPath();ctx.moveTo(RULER_W-6,sy+0.5);ctx.lineTo(RULER_W,sy+0.5);ctx.stroke();
    ctx.textAlign='right'; ctx.fillText(String(y), RULER_W-9, sy);
  }
  ctx.fillStyle='rgba(20,22,26,0.88)';
  ctx.fillRect(0,canvas.height-RULER_H,RULER_W,RULER_H);
}

function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML;}
function canvasPoint(event){
  const rect=canvas.getBoundingClientRect();
  return {
    x:(event.clientX-rect.left)*(canvas.width/rect.width),
    y:(event.clientY-rect.top)*(canvas.height/rect.height),
  };
}
function showPanel(p){
  const t=tileAt(p.x,p.y); const panel=document.getElementById('panel'),c=document.getElementById('panelContent');
  let html=`<h3>(${p.x} | ${p.y})</h3>`;
  if(t.kind==='village'){const v=t.data;
    html+=`<div class="row"><span>Village</span><span>${esc(v.village_name)}</span></div>
    <div class="row"><span>Player</span><span>${esc(v.player_name)}</span></div>
    <div class="row"><span>Alliance</span><span>${esc(v.alliance_tag||'-')}</span></div>
    <div class="row"><span>Populasi</span><span>${v.population}</span></div>
    <div class="row"><span>Ibu kota</span><span>${v.is_capital?'Ya':'Tidak'}</span></div>`;
  } else if(t.kind==='empty'){
    html+=`<div class="row"><span>Status</span><span>Slot kosong</span></div>
    <div class="row"><span>Tipe field</span><span>${esc(t.data.field_label)}</span></div>`;
  } else if(t.kind==='oasis'){
    const names={wood:'Kayu',clay:'Liat',iron:'Besi',crop:'Gandum'};
    html+=`<div class="row"><span>Resource</span><span>${esc(names[t.data.resource])}</span></div>
    <div class="row"><span>Terrain</span><span>${esc(t.data.type_name)}</span></div>
    <div class="row"><span>Bonus</span><span>${esc(t.data.bonus_str)}${t.data.is_double?' (double)':''}</span></div>`;
  } else if(t.kind==='natar'){
    html+=`<div class="row"><span>Status</span><span>Natar camp</span></div>
    <div class="row"><span>Nama</span><span>${esc(t.data.camp_name)}</span></div>`;
  } else {
    html+=`<div class="row"><span>Tipe</span><span>${esc(t.data.type)} (tidak bisa disettle)</span></div>`;
  }
  c.innerHTML=html; panel.classList.add('show');
}

canvas.addEventListener('mousedown',e=>{isDrag=true;dragMoved=false;lastX=e.clientX;lastY=e.clientY;canvas.classList.add('dragging');});
addEventListener('mousemove',e=>{
  if(isDrag){
    const dx=e.clientX-lastX,dy=e.clientY-lastY;
    if(Math.abs(dx)>2||Math.abs(dy)>2) dragMoved=true;
    viewX-=dx/tileSize; viewY+=dy/tileSize; lastX=e.clientX; lastY=e.clientY; render();
  } else {
    const point=canvasPoint(e); const w=s2w(point.x,point.y);
    if(!hover||hover.x!==w.x||hover.y!==w.y){hover=w;render();}
  }
});
addEventListener('mouseup',()=>{if(isDrag){isDrag=false;canvas.classList.remove('dragging');}});
canvas.addEventListener('click',e=>{
  if(dragMoved) return;
  const point=canvasPoint(e); selected=s2w(point.x,point.y);
  showPanel(selected); render();
});
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const point=canvasPoint(e),mx=point.x,my=point.y;
  const before=s2wf(mx,my);
  tileSize=Math.min(MAX_T,Math.max(MIN_T,tileSize*(e.deltaY<0?1.15:1/1.15)));
  const after=s2wf(mx,my);
  viewX+=before.x-after.x; viewY+=before.y-after.y; render();
},{passive:false});

let touchLast=null;
canvas.addEventListener('touchstart',e=>{if(e.touches.length===1) touchLast={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
canvas.addEventListener('touchmove',e=>{
  if(e.touches.length===1&&touchLast){
    const dx=e.touches[0].clientX-touchLast.x, dy=e.touches[0].clientY-touchLast.y;
    viewX-=dx/tileSize; viewY+=dy/tileSize;
    touchLast={x:e.touches[0].clientX,y:e.touches[0].clientY}; render();
  }
},{passive:true});
canvas.addEventListener('touchend',()=>{touchLast=null;});

function updateBreadcrumb(){
  const link=document.getElementById('bc-server');
  if(window.SERVER_CONFIG&&link){link.textContent=window.SERVER_CONFIG.slug;link.href=`/s/${window.SERVER_CONFIG.slug}/map/`;}
}

updateBreadcrumb();
resize();
showPanel(selected);
bootLiveData();
