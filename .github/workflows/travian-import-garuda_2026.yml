name: Travian Map Import - Garuda 2026

on:
  schedule:
    - cron: "40 22 * * *"
  workflow_dispatch:

jobs:
  import:
    name: Download & Import map.sql (Garuda 2026)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run import script
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL_GARUDA_2026 }}
          TURSO_AUTH_TOKEN:   ${{ secrets.TURSO_AUTH_TOKEN_GARUDA_2026 }}
        run: |
          python scripts/import_map_garuda_2026.py

      - name: Done
        if: success()
        run: echo "Import Garuda 2026 berhasil!"

      - name: Failed
        if: failure()
        run: echo "Import Garuda 2026 gagal - cek log di atas"