name: Travian Map Import — America 9

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  import:
    name: Download & Import map.sql (America 9)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run import script
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL_AMERICA_9 }}
          TURSO_AUTH_TOKEN:   ${{ secrets.TURSO_AUTH_TOKEN_AMERICA_9 }}
        run: |
          python scripts/import_map_america_9.py

      - name: Done
        if: success()
        run: echo "✅ Import America 9 berhasil!"

      - name: Failed
        if: failure()
        run: echo "❌ Import America 9 gagal — cek log di atas"
